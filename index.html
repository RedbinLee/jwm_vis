<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>농산물 공판장 실시간 시세 조회</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gray-100 text-gray-900 font-sans min-h-screen flex flex-col justify-between"
  >
    <!-- 상단 헤더 -->
    <header class="bg-emerald-600 text-white shadow py-4 px-4 text-center">
      <h1 class="text-xl font-bold">🌾 농산물 공판장 실시간 시세</h1>
      <p class="text-xs text-emerald-100 mt-1">
        시장 유형과 공판장, 품목을 선택해 주세요
      </p>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-md w-full mx-auto p-4 space-y-4 flex-grow">
      <!-- 선택 영역 카드 -->
      <section class="bg-white p-5 rounded-2xl shadow-sm space-y-4">
        <!-- 1. 시장 구분 선택 -->
        <div>
          <label
            for="marketTypeSelect"
            class="block font-semibold text-gray-700 text-sm mb-1"
            >1. 시장 구분 선택</label
          >
          <select
            id="marketTypeSelect"
            class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-base bg-gray-50 focus:outline-none focus:border-emerald-500"
          >
            <option value="">-- 시장 구분을 선택하세요 --</option>
            <option value="public">공영 도매시장</option>
            <option value="origin">산지 공판장</option>
          </select>
        </div>

        <!-- 2. 공판장 선택 -->
        <div>
          <label
            for="marketSelect"
            class="block font-semibold text-gray-700 text-sm mb-1"
            >2. 공판장 선택</label
          >
          <select
            id="marketSelect"
            class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-base bg-gray-50 focus:outline-none focus:border-emerald-500"
            disabled
          >
            <option value="">-- 시장 구분을 먼저 선택하세요 --</option>
          </select>
        </div>

        <!-- 3. 품목 선택 -->
        <div>
          <label
            for="itemSelect"
            class="block font-semibold text-gray-700 text-sm mb-1"
            >3. 품목 선택</label
          >
          <select
            id="itemSelect"
            class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-base bg-gray-50 focus:outline-none focus:border-emerald-500"
            disabled
          >
            <option value="">-- 공판장을 먼저 선택하세요 --</option>
          </select>
        </div>
      </section>

      <!-- 결과 표시 영역 -->
      <section id="resultSection" class="hidden space-y-4">
        <div
          id="statusBadge"
          class="text-center py-2 px-4 rounded-xl text-xs font-bold shadow-sm"
        ></div>

        <div
          class="bg-white p-6 rounded-2xl shadow-sm space-y-4 text-center border-2 border-emerald-500"
        >
          <div>
            <span
              id="selectedTitle"
              class="text-xs text-gray-500 font-medium bg-gray-100 px-3 py-1 rounded-full"
            ></span>
            <h2
              id="itemTitleDisplay"
              class="text-2xl font-black text-emerald-700 mt-2"
            >
              품목명 (단위)
            </h2>
          </div>

          <div
            class="grid grid-cols-3 gap-2 py-3 border-t border-b border-gray-100"
          >
            <div class="bg-red-50 p-3 rounded-xl">
              <p class="text-xs text-red-600 font-bold mb-1">최고가</p>
              <p id="highPrice" class="text-base font-extrabold text-red-700">
                -
              </p>
            </div>
            <div class="bg-emerald-50 p-3 rounded-xl">
              <p class="text-xs text-emerald-600 font-bold mb-1">평균가</p>
              <p id="avgPrice" class="text-lg font-black text-emerald-800">-</p>
            </div>
            <div class="bg-blue-50 p-3 rounded-xl">
              <p class="text-xs text-blue-600 font-bold mb-1">최저가</p>
              <p id="lowPrice" class="text-base font-extrabold text-blue-700">
                -
              </p>
            </div>
          </div>

          <p id="updateTime" class="text-xs text-gray-400"></p>
        </div>
      </section>

      <!-- 초기 안내 문구 -->
      <div id="guideMessage" class="text-center py-8 text-gray-400 text-sm">
        👆 위에서 시장 구분부터 차례대로 선택하시면<br />실시간 시세가 크게
        나타납니다.
      </div>
    </main>

    <footer class="text-center py-4 text-xs text-gray-400">
      농산물 공판장 일일 정산 및 시세 조회 서비스
    </footer>

    <script src="app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>우리동네 농산물 가격 조회</title>
    <style>
      body {
        font-family: 'Malgun Gothic', sans-serif;
        background-color: #f4f6f9;
        margin: 0;
        padding: 20px;
        color: #333;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        background: #fff;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      h1 {
        text-align: center;
        font-size: 26px;
        color: #2c3e50;
        margin-bottom: 25px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 8px;
        color: #2c3e50;
      }
      select,
      input {
        width: 100%;
        padding: 14px;
        font-size: 18px;
        border: 2px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
        background-color: #fff;
      }
      button {
        width: 100%;
        padding: 16px;
        font-size: 20px;
        font-weight: bold;
        background-color: #27ae60;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
      }
      button:hover {
        background-color: #219653;
      }
      .result-box {
        margin-top: 30px;
        display: none;
      }
      .price-card {
        background: #f8f9fa;
        border-left: 6px solid #27ae60;
        padding: 20px;
        margin-bottom: 15px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }
      .price-title {
        font-size: 16px;
        color: #7f8c8d;
        margin-bottom: 5px;
      }
      .price-value {
        font-size: 28px;
        font-weight: bold;
        color: #2c3e50;
      }
      .high {
        border-left-color: #e74c3c;
      }
      .avg {
        border-left-color: #f39c12;
      }
      .low {
        border-left-color: #3498db;
      }
      .status-msg {
        text-align: center;
        font-size: 16px;
        color: #e67e22;
        margin-bottom: 15px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>농산물 경매/정산 가격 조회</h1>

      <!-- 2번 조건: 필수 입력 항목 선택 드롭다운 -->
      <div class="form-group">
        <label for="apiType">조회 데이터 구분</label>
        <select id="apiType" onchange="toggleMarketType()">
          <option value="katSale">전국 공영도매시장 정산정보</option>
          <option value="originTrialHall">전국 산지공판장 거래정보</option>
        </select>
      </div>

      <div class="form-group">
        <label for="marketCode" id="marketLabel">도매시장 선택</label>
        <select id="marketCode">
          <!-- 예시 코드 (실제 운영시 관할 코드 입력) -->
          <option value="110001">서울가락도매시장</option>
          <option value="210001">부산강서도매시장</option>
          <option value="310001">대구북부도매시장</option>
        </select>
      </div>

      <div class="form-group">
        <label for="largeCategory">상품 대분류 선택</label>
        <select id="largeCategory">
          <option value="06">과실류[cite: 3]</option>
          <option value="08">과일과채류[cite: 3]</option>
          <option value="09">과채류[cite: 3]</option>
          <option value="10">엽경채류[cite: 3]</option>
          <option value="11">근채류[cite: 3]</option>
          <option value="12">조미채소류[cite: 3]</option>
        </select>
      </div>

      <div class="form-group">
        <label for="searchDate">조회일자 (거래정산일)</label>
        <input type="date" id="searchDate" />
      </div>

      <button onclick="fetchPrices()">가격 조회하기</button>

      <!-- 4번 조건: 최고가, 평균가, 최저가 시각화 영역 -->
      <div class="result-box" id="resultBox">
        <div class="status-msg" id="statusMsg"></div>

        <div class="price-card high">
          <div class="price-title">📈 오늘의 최고가</div>
          <div class="price-value" id="hgprcVal">- 원</div>
        </div>

        <div class="price-card avg">
          <div class="price-title">📊 오늘의 평균가</div>
          <div class="price-value" id="avgprcVal">- 원</div>
        </div>

        <div class="price-card low">
          <div class="price-title">📉 오늘의 최저가</div>
          <div class="price-value" id="lwprcVal">- 원</div>
        </div>
      </div>
    </div>

    <script>
      // 오늘 날짜를 기본값으로 세팅
      document.getElementById('searchDate').valueAsDate = new Date();

      function toggleMarketType() {
        const type = document.getElementById('apiType').value;
        const label = document.getElementById('marketLabel');
        const select = document.getElementById('marketCode');

        if (type === 'katSale') {
          label.innerText = '도매시장 선택';
          select.innerHTML = `
                <option value="110001">서울가락도매시장</option>
                <option value="210001">부산강서도매시장</option>
            `;
        } else {
          label.innerText = '공판장 선택';
          select.innerHTML = `
                <option value="240101">산지공판장 예시코드1</option>
                <option value="240102">산지공판장 예시코드2</option>
            `;
        }
      }

      async function fetchPrices() {
        const apiType = document.getElementById('apiType').value;
        const marketCode = document.getElementById('marketCode').value;
        const largeCategory = document.getElementById('largeCategory').value;
        const rawDate = document.getElementById('searchDate').value; // YYYY-MM-DD

        if (!rawDate) {
          alert('조회일자를 선택해주세요.');
          return;
        }

        // 날짜 형식 변환 (katSale은 YYYY-MM-DD, originTrialHall은 YYYYMMDD)
        const dateFormatted1 = rawDate;
        const dateFormatted2 = rawDate.replace(/-/g, '');

        // 3번 조건: 클라이언트(프론트엔드) 코드에서 서비스 키를 노출하지 않기 위해
        // 인증키를 포함하지 않고 자체 백엔드(서버리스 함수 또는 서버)로 요청을 보냅니다.
        // 예: const backendUrl = `/api/getMarketPrices?service=${apiType}&market=${marketCode}&category=${largeCategory}&date=${dateFormatted1}`;

        // --- [보안 설계 안내] ---
        // 실제 서비스 구축 시 프론트엔드가 아닌 서버(Node.js, AWS Lambda 등)에서
        // 공공데이터포털 API키(serviceKey)를 숨겨두고 호출한 뒤 결과만 프론트엔드로 전달해야 합니다.

        try {
          // 시뮬레이션용 예시 호출 (실제 구현 시 서버 엔드포인트로 교체)
          // const response = await fetch(backendUrl);
          // const data = await response.json();

          // [임시 데이터 표시 예시] (정산 전/후 상태 메시지 포함)
          document.getElementById('resultBox').style.display = 'block';

          // 4번 조건: 정산 전/후 안내 메시지 및 가격 데이터 매핑
          // (실제 API 응답 데이터에 맞춰 필드 연결: katSale은 avgprc, hgprc, lwprc / originTrialHall은 scsbd_prc 등 활용)
          document.getElementById('statusMsg').innerText =
            '💡 현재까지 집계된 실시간(정산 전) 데이터입니다.';

          document.getElementById('hgprcVal').innerText = '15,000 원';
          document.getElementById('avgprcVal').innerText = '12,500 원';
          document.getElementById('lwprcVal').innerText = '9,800 원';
        } catch (error) {
          alert(
            '데이터를 불러오는 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.',
          );
          console.error(error);
        }
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>우리동네 농산물 가격 조회</title>
    <style>
      body {
        font-family: 'Malgun Gothic', sans-serif;
        background-color: #f4f6f9;
        margin: 0;
        padding: 15px;
        color: #333;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        background: #fff;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      h1 {
        text-align: center;
        font-size: 24px;
        color: #2c3e50;
        margin-bottom: 20px;
      }
      .form-group {
        margin-bottom: 18px;
      }
      label {
        display: block;
        font-size: 17px;
        font-weight: bold;
        margin-bottom: 8px;
        color: #2c3e50;
      }
      .required::after {
        content: ' *';
        color: #e74c3c;
      }
      select,
      input {
        width: 100%;
        padding: 14px;
        font-size: 17px;
        border: 2px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
        background-color: #fff;
      }
      button {
        width: 100%;
        padding: 16px;
        font-size: 20px;
        font-weight: bold;
        background-color: #27ae60;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
      }
      button:hover {
        background-color: #219653;
      }
      .result-box {
        margin-top: 25px;
        display: none;
      }
      .price-card {
        background: #f8f9fa;
        border-left: 6px solid #27ae60;
        padding: 18px;
        margin-bottom: 12px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }
      .price-title {
        font-size: 15px;
        color: #7f8c8d;
        margin-bottom: 5px;
      }
      .price-value {
        font-size: 26px;
        font-weight: bold;
        color: #2c3e50;
      }
      .high {
        border-left-color: #e74c3c;
      }
      .avg {
        border-left-color: #f39c12;
      }
      .low {
        border-left-color: #3498db;
      }
      .status-msg {
        text-align: center;
        font-size: 15px;
        color: #d35400;
        margin-bottom: 15px;
        font-weight: bold;
        background: #fef5e7;
        padding: 10px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>농산물 가격 조회</h1>

      <!-- 조회 데이터 구분 선택 -->
      <div class="form-group">
        <label class="required">조회 데이터 구분</label>
        <select id="apiType" onchange="switchApiMode()">
          <option value="katSale">전국 공영도매시장 정산정보</option>
          <option value="originTrialHall">전국 산지공판장 거래정보</option>
        </select>
      </div>

      <!-- 시장/공판장 선택 (동적 변경) -->
      <div class="form-group">
        <label id="marketLabel" class="required">도매시장 선택</label>
        <select id="marketCode">
          <!-- 동적으로 채워짐 -->
        </select>
      </div>

      <!-- 상품 대분류 선택 (선택 항목) -->
      <div class="form-group">
        <label>상품 대분류 선택 (선택)</label>
        <select id="largeCategory">
          <option value="">전체 품목</option>
          <option value="06">과실류[cite: 3]</option>
          <option value="08">과일과채류[cite: 3]</option>
          <option value="09">과채류[cite: 3]</option>
          <option value="10">엽경채류[cite: 3]</option>
          <option value="11">근채류[cite: 3]</option>
          <option value="12">조미채소류[cite: 3]</option>
          <option value="17">버섯류[cite: 3]</option>
        </select>
      </div>

      <!-- 조회일자 (필수) -->
      <div class="form-group">
        <label class="required" id="dateLabel">조회일자 (거래정산일)</label>
        <input type="date" id="searchDate" />
      </div>

      <button onclick="fetchPrices()">가격 조회하기</button>

      <!-- 결과 시각화 영역 -->
      <div class="result-box" id="resultBox">
        <div class="status-msg" id="statusMsg">
          💡 정산 전/후 데이터를 불러왔습니다.
        </div>

        <div class="price-card high">
          <div class="price-title">📈 오늘의 최고가</div>
          <div class="price-value" id="hgprcVal">- 원</div>
        </div>

        <div class="price-card avg">
          <div class="price-title">📊 오늘의 평균가</div>
          <div class="price-value" id="avgprcVal">- 원</div>
        </div>

        <div class="price-card low">
          <div class="price-title">📉 오늘의 최저가</div>
          <div class="price-value" id="lwprcVal">- 원</div>
        </div>
      </div>
    </div>

    <script>
      // 오늘 날짜 기본 세팅
      document.getElementById('searchDate').valueAsDate = new Date();

      // 전국 주요 시장 및 공판장 코드 데이터
      const marketOptions = {
        katSale: [
          { code: '110001', name: '서울가락도매시장' },
          { code: '210001', name: '부산강서도매시장' },
          { code: '310001', name: '대구북부도매시장' },
          { code: '330001', name: '대구농수산물도매시장' },
          { code: '350001', name: '인천남촌도매시장' },
          { code: '370001', name: '광주각화도매시장' },
          { code: '380001', name: '대전오정도매시장' },
          { code: '390001', name: '울산중앙도매시장' },
        ],
        originTrialHall: [
          { code: '240101', name: '한국농수산식품유통공사 서울공판장' },
          { code: '240201', name: '부산공판장' },
          { code: '240301', name: '대구공판장' },
          { code: '240401', name: '인천공판장' },
          { code: '240501', name: '광주공판장' },
          { code: '240601', name: '대전공판장' },
        ],
      };

      function switchApiMode() {
        const type = document.getElementById('apiType').value;
        const label = document.getElementById('marketLabel');
        const select = document.getElementById('marketCode');

        select.innerHTML = '';
        if (type === 'katSale') {
          label.innerText = '도매시장 선택';
          marketOptions.katSale.forEach((m) => {
            let opt = document.createElement('option');
            opt.value = m.code;
            opt.innerText = m.name;
            select.appendChild(opt);
          });
        } else {
          label.innerText = '공판장 선택';
          marketOptions.originTrialHall.forEach((m) => {
            let opt = document.createElement('option');
            opt.value = m.code;
            opt.innerText = m.name;
            select.appendChild(opt);
          });
        }
      }

      // 초기 실행 시 도매시장 목록 로드
      switchApiMode();

      async function fetchPrices() {
        const apiType = document.getElementById('apiType').value;
        const marketCode = document.getElementById('marketCode').value;
        const largeCategory = document.getElementById('largeCategory').value;
        const rawDate = document.getElementById('searchDate').value; // YYYY-MM-DD

        if (!rawDate) {
          alert('조회일자를 선택해주세요.');
          return;
        }

        // 공판장은 YYYYMMDD, 도매시장은 YYYY-MM-DD 형태 반영
        const formattedDateForServer = rawDate;

        // 백엔드 서버로 요청 전송 (프론트엔드와 백엔드 분리 구조)
        const endpoint =
          apiType === 'katSale' ? '/api/kat-sale' : '/api/origin-trial-hall';
        let queryUrl = `http://localhost:3000${endpoint}?`;

        if (apiType === 'katSale') {
          queryUrl += `whsl_mrkt_cd=${marketCode}&trd_clcln_ymd=${formattedDateForServer}`;
        } else {
          queryUrl += `trhl_cd=${marketCode}&clcln_ymd=${formattedDateForServer.replace(/-/g, '')}`;
        }

        if (largeCategory) {
          queryUrl += `&gds_lclsf_cd=${largeCategory}`;
        }

        try {
          document.getElementById('resultBox').style.display = 'block';
          document.getElementById('statusMsg').innerText =
            '⏳ 데이터를 불러오는 중입니다...';

          const response = await fetch(queryUrl);
          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.error || '서버 응답 오류');
          }

          // 응답 데이터 파싱 (items 배열 추출)
          const items = result.body?.items?.item || [];

          if (items.length === 0) {
            document.getElementById('statusMsg').innerText =
              '⚠️ 선택하신 조건에 해당하는 데이터가 아직 없습니다. (정산 전이거나 거래 내역이 없을 수 있습니다)';
            document.getElementById('hgprcVal').innerText = '- 원';
            document.getElementById('avgprcVal').innerText = '- 원';
            document.getElementById('lwprcVal').innerText = '- 원';
            return;
          }

          // 정산 상태 안내 메시지 표시
          document.getElementById('statusMsg').innerText =
            '✅ 성공적으로 조회되었습니다. (현재까지 집계된 가격 데이터)';

          // 첫 번째 항목 또는 대표 가격 데이터 매핑 (API 명세 컬럼 기준)
          const data = Array.isArray(items) ? items[0] : items;

          const highPrice = data.hgprc || data.scsbd_prc || '0';
          const avgPrice = data.avgprc || data.tot_prc || '0';
          const lowPrice = data.lwprc || data.scsbd_prc || '0';

          document.getElementById('hgprcVal').innerText =
            Number(highPrice).toLocaleString() + ' 원';
          document.getElementById('avgprcVal').innerText =
            Number(avgPrice).toLocaleString() + ' 원';
          document.getElementById('lwprcVal').innerText =
            Number(lowPrice).toLocaleString() + ' 원';
        } catch (error) {
          alert('데이터를 가져오는 중 오류가 발생했습니다: ' + error.message);
          document.getElementById('statusMsg').innerText =
            '❌ 오류가 발생했습니다.';
        }
      }
    </script>
  </body>
</html>
